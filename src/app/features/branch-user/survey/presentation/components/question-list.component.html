<div class="space-y-3">
  @for (question of questions(); track question.id) {
    <article class="border border-slate-100 bg-slate-50">
      <div class="flex items-start justify-between">
        <p class="font-semibold text-slate-800">{{ question.text }}</p>
        <span class="rounded-full bg-white px-3 py-1 text-xs font-bold text-slate-500">{{
          question.type
        }}</span>
      </div>
      @if (question.options.length > 0) {
        <div class="mt-3 flex flex-wrap gap-2">
          @for (option of question.options; track option) {
            <span class="rounded-full bg-cyan-50 px-3 py-1 text-xs font-semibold text-[var(--theme-color-accent)]">{{
              option
            }}</span>
          }
        </div>
      }
    </article>
  } @empty {
    <p class="bg-slate-50 text-slate-500">{{ 'survey.noQuestions' | t }}</p>
  }
</div>
