<div class="space-y-3">
  @for (question of questions(); track question.id) {
    <article class="rounded-2xl border border-slate-100 bg-slate-50 p-4">
      <div class="flex items-start justify-between gap-4">
        <p class="font-semibold text-slate-800">{{ question.text }}</p>
        <span class="rounded-full bg-white px-3 py-1 text-xs font-bold text-slate-500">{{ question.type }}</span>
      </div>
      @if (question.options.length > 0) {
        <div class="mt-3 flex flex-wrap gap-2">
          @for (option of question.options; track option) {
            <span class="rounded-full bg-cyan-50 px-3 py-1 text-xs font-semibold text-[#11A7C9]">{{ option }}</span>
          }
        </div>
      }
    </article>
  } @empty {
    <p class="rounded-2xl bg-slate-50 p-5 text-sm text-slate-500">{{ 'survey.noQuestions' | t }}</p>
  }
</div>
