<div class="login-wrapper">
  <!-- Clean subtle background effect -->
  <div
    class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-cyan-50 via-white to-white opacity-80"
  ></div>

  <div class="login-container w-full max-w-[26rem] animate-fade-in-up">
    <!-- Brand (Mobile only, hidden on LG) -->
    <div class="mb-8 flex justify-center lg:hidden">
      <img [src]="brandAssets.authLogo" alt="NILETRONIX" class="h-10 w-auto" />
    </div>

    <!-- Header -->
    <div class="mb-8 text-center animate-fade-in-down" style="animation-delay: 100ms">
      <h2 class="text-3xl font-extrabold tracking-tight text-slate-900">
        {{ 'auth.welcomeBack' | t }}
      </h2>
      <p class="mt-2 text-sm font-medium text-slate-500">{{ 'auth.signInSubtitle' | t }}</p>
    </div>

    <!-- The Card -->
    <div
      class="rounded-3xl bg-white p-6 shadow-[0_8px_30px_rgb(var(--theme-shadow-rgb)/4%)] ring-1 ring-slate-100 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_20px_40px_rgb(var(--theme-shadow-rgb)/8%)] sm:p-8"
    >
      <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
        <app-input
          [label]="'auth.userNameOrEmail' | t"
          type="text"
          [placeholder]="'auth.userNameOrEmailPlaceholder' | t"
          formControlName="userNameOrEmail"
          [error]="userNameOrEmailError()"
        />

        <app-input
          [label]="'common.password' | t"
          type="password"
          [placeholder]="'auth.passwordPlaceholder' | t"
          formControlName="password"
          [error]="passwordError()"
        />

        @if (authStore.error()) {
          <div
            class="error-box flex items-center gap-3 rounded-xl bg-red-50 p-3 text-sm font-medium text-red-600"
          >
            <span class="flex h-2 w-2 shrink-0 animate-pulse rounded-full bg-red-500"></span>
            {{ authStore.error() ?? '' | t }}
          </div>
        }

        <div class="pt-2">
          <app-button type="submit" [fullWidth]="true" [loading]="authStore.loading()">
            <app-icon [icon]="loginIcon" [size]="18" />
            {{ 'auth.signIn' | t }}
          </app-button>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <app-footer
      class="login-footer mt-8 block text-center opacity-70 transition-opacity hover:opacity-100"
    />
  </div>
</div>
