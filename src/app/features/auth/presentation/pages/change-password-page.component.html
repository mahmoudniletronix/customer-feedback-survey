<div class="login-wrapper">
  <div
    class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-cyan-50 via-white to-white opacity-80"
  ></div>

  <div class="login-container w-full max-w-[28rem] animate-fade-in-up">
    <div class="mb-8 flex justify-center lg:hidden">
      <img [src]="brandAssets.authLogo" alt="NILETRONIX" class="h-10 w-auto" />
    </div>

    <div class="mb-8 text-center animate-fade-in-down" style="animation-delay: 100ms">
      <span
        class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-[var(--theme-color-accent-softest)] text-[var(--theme-color-accent)] ring-1 ring-[var(--theme-color-accent-soft)]"
      >
        <app-icon [icon]="passwordIcon" [size]="22" />
      </span>
      <h2 class="text-3xl font-extrabold tracking-tight text-slate-900">
        {{ 'auth.changePasswordTitle' | t }}
      </h2>
      <p class="mt-2 text-sm font-medium leading-6 text-slate-500">
        {{ reasonMessageKey() | t }}
      </p>
    </div>

    <div
      class="rounded-3xl bg-white p-6 shadow-[0_8px_30px_rgb(var(--theme-shadow-rgb)/4%)] ring-1 ring-slate-100 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_20px_40px_rgb(var(--theme-shadow-rgb)/8%)] sm:p-8"
    >
      <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
        <app-input
          [label]="'auth.newPassword' | t"
          type="password"
          [placeholder]="'auth.newPasswordPlaceholder' | t"
          formControlName="newPassword"
          [error]="newPasswordError()"
        />

        <app-input
          [label]="'auth.confirmNewPassword' | t"
          type="password"
          [placeholder]="'auth.confirmNewPasswordPlaceholder' | t"
          formControlName="confirmNewPassword"
          [error]="confirmNewPasswordError()"
        />

        @if (authStore.error()) {
          <div
            class="error-box flex items-center gap-3 rounded-xl bg-red-50 p-3 text-sm font-medium text-red-600"
          >
            <span class="flex h-2 w-2 shrink-0 animate-pulse rounded-full bg-red-500"></span>
            {{ authStore.error() ?? '' | t }}
          </div>
        }

        <div class="space-y-3 pt-2">
          <app-button type="submit" [fullWidth]="true" [loading]="authStore.loading()">
            <app-icon [icon]="submitIcon" [size]="18" />
            {{ 'auth.updatePassword' | t }}
          </app-button>

          <app-button
            type="button"
            variant="secondary"
            [fullWidth]="true"
            [disabled]="authStore.loading()"
            (pressed)="logout()"
          >
            <app-icon [icon]="logoutIcon" [size]="16" [flipRtl]="true" />
            {{ 'common.logout' | t }}
          </app-button>
        </div>
      </form>
    </div>

    <app-footer
      class="login-footer mt-8 block text-center opacity-70 transition-opacity hover:opacity-100"
    />
  </div>
</div>
