<div class="login-wrapper">
  <!-- Decorative background elements -->
  <div class="bg-blur-blob blob-1"></div>
  <div class="bg-blur-blob blob-2"></div>

  <div class="login-container">
    <div class="login-brand lg:hidden">
      <img src="/images/nile.png" alt="NILETRONIX" />
    </div>

    <div class="login-header text-center mb-8">
      <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">
        {{ 'auth.welcomeBack' | t }}
      </h2>
      <p class="mt-2 text-slate-500 font-medium">{{ 'auth.signInSubtitle' | t }}</p>
    </div>

    <div class="premium-card">
      <app-card>
        <form class="login-form space-y-6" [formGroup]="form" (ngSubmit)="submit()">
          <app-input
            [label]="'auth.userNameOrEmail' | t"
            type="text"
            [placeholder]="'auth.userNameOrEmailPlaceholder' | t"
            formControlName="userNameOrEmail"
            [error]="userNameOrEmailError()"
          />

          <div class="space-y-1">
            <app-input
              [label]="'common.password' | t"
              type="password"
              [placeholder]="'auth.passwordPlaceholder' | t"
              formControlName="password"
              [error]="passwordError()"
            />
            <!-- <div class="flex justify-end">
              <a
                href="javascript:void(0)"
                class="text-xs font-semibold text-[#11A7C9] hover:text-[#0e8bab] transition-colors"
              >
                {{ 'auth.forgotPassword' | t }}
              </a>
            </div> -->
          </div>

          @if (authStore.error()) {
            <div
              class="error-box rounded-2xl bg-red-50 p-4 text-sm font-semibold text-[#D94B5A] flex items-center gap-3"
            >
              <span class="error-dot h-2 w-2 rounded-full bg-[#D94B5A] animate-pulse"></span>
              {{ authStore.error() ?? '' | t }}
            </div>
          }

          <app-button type="submit" [fullWidth]="true" [loading]="authStore.loading()">
            <app-icon [icon]="loginIcon" [size]="18" />
            {{ 'auth.signIn' | t }}
          </app-button>
        </form>
      </app-card>
    </div>

    <div class="login-footer mt-10 text-center text-xs font-medium text-slate-400">
      &copy; {{ currentYear }} Niletronix. All rights reserved.
    </div>
  </div>
</div>
