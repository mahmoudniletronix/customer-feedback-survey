<article class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm shadow-slate-200/70">
  <div class="flex items-start justify-between gap-4">
    <p class="text-sm font-bold text-slate-500">{{ report().titleKey | t }}</p>
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-cyan-50 text-[#11A7C9]">
      <app-icon [icon]="icons[report().icon]" [size]="19" />
    </span>
  </div>
  <p class="mt-3 text-3xl font-bold text-[#1F3A56]">{{ report().metric }}</p>
  <p class="mt-3 text-sm leading-6 text-slate-600">{{ report().descriptionKey | t }}</p>
</article>
