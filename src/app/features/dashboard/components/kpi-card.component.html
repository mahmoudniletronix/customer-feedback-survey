<article class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm shadow-slate-200/70">
  <div class="flex items-start justify-between gap-4">
    <div class="flex items-start gap-3">
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl" [class]="iconClasses()">
        <app-icon [icon]="icons[kpi().icon]" [size]="20" />
      </span>
      <div>
        <p class="text-sm font-semibold text-slate-500">{{ kpi().labelKey | t }}</p>
        <p class="mt-2 text-3xl font-bold text-slate-900">{{ kpi().value }}</p>
      </div>
    </div>
    <span class="rounded-2xl px-3 py-1 text-xs font-bold" [class]="badgeClasses()">
      {{ kpi().deltaKey | t }}
    </span>
  </div>
</article>
