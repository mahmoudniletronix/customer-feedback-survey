<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">{{ dashboardStore.heading() }}</h2>
    <p class="mt-2 text-sm text-slate-500">{{ 'dashboard.kpiDescription' | t }}</p>
  </div>

  <div class="grid gap-4 md:grid-cols-3">
    @for (kpi of dashboardStore.kpis(); track kpi.labelKey) {
      <app-kpi-card [kpi]="kpi" />
    }
  </div>

  <div class="grid gap-6 xl:grid-cols-[1.3fr_0.7fr]">
    <app-card [title]="'dashboard.responseTrend' | t" [subtitle]="'dashboard.responseTrendSubtitle' | t">
      <app-trend-chart [data]="dashboardStore.trend()" />
    </app-card>

    <app-card [title]="'dashboard.roleWorkspace' | t" [subtitle]="'dashboard.roleWorkspaceSubtitle' | t">
      <div class="space-y-3 text-sm text-slate-600">
        @for (action of workspaceActions(); track action.path) {
          <a
            [routerLink]="action.path"
            class="flex items-center gap-3 rounded-2xl bg-slate-50 p-4 transition hover:bg-cyan-50 hover:text-[#0e8bab]"
          >
            <app-icon [icon]="action.icon" [size]="18" />
            {{ action.labelKey | t }}
          </a>
        } @empty {
          <p class="flex items-center gap-3 rounded-2xl bg-slate-50 p-4">
            <app-icon [icon]="fileTextIcon" [size]="18" />
            {{ 'common.noRecords' | t }}
          </p>
        }
      </div>
    </app-card>
  </div>
</div>
