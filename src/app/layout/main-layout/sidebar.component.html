<aside
  class="app-sidebar fixed inset-y-0 start-0 z-50 flex h-dvh transition-all duration-400 lg:sticky lg:top-0 lg:z-40 lg:translate-x-0"
  [class.sidebar-collapsed]="collapsed()"
  [class.mobile-open]="mobileOpen()"
>
  <div class="sidebar-inner flex min-h-0 w-full flex-col p-4">
    <!-- Brand -->
    <div class="brand-section mb-10 flex items-center gap-3 px-2">
      <div class="brand-logo-container">
        <app-icon [icon]="brandIcon" [size]="22" />
      </div>
      @if (!collapsed()) {
        <div class="brand-text min-w-0">
          <p class="brand-name truncate">{{ 'app.brand' | t }}</p>
          <p class="brand-subtitle truncate">{{ 'app.console' | t }}</p>
        </div>
      }
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav min-h-0 flex-1 space-y-2 overflow-y-auto custom-scrollbar">
      @for (item of menuItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-item-active"
          class="nav-item group"
          (click)="close.emit()"
        >
          <div class="nav-icon-box">
            <app-icon [icon]="item.icon" [size]="20" />
          </div>
          @if (!collapsed()) {
            <span class="nav-label">{{ item.labelKey | t }}</span>
          }
        </a>
      }
    </nav>

    <!-- Footer / Collapse -->
    <div class="sidebar-footer mt-auto pt-4 border-t border-white/5">
      <button
        type="button"
        class="collapse-btn"
        (click)="toggle.emit()"
        [attr.aria-label]="collapsed() ? ('common.expandSidebar' | t) : ('common.collapseSidebar' | t)"
      >
        <app-icon [icon]="collapsed() ? panelLeftOpenIcon : panelLeftCloseIcon" [size]="18" />
        @if (!collapsed()) {
          <span>{{ 'common.collapse' | t }}</span>
        }
      </button>
    </div>
  </div>
</aside>
