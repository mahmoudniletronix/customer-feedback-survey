<main class="auth-page grid min-h-screen bg-[#F7F9FC] lg:grid-cols-[1.05fr_0.95fr]">
  <section
    class="auth-hero hidden overflow-hidden bg-[#1F3A56] p-10 text-white lg:flex lg:flex-col lg:justify-between"
  >
    <div class="auth-hero-content">
      <div
        class="hero-logo mb-14 inline-flex rounded-2xl bg-white px-6 py-4 shadow-2xl shadow-slate-950/15"
      >
        <img class="h-14 w-auto" src="/images/nile.png" alt="NILETRONIX" />
      </div>
      <h1 class="hero-title max-w-xl text-4xl font-bold leading-tight">
        {{ 'app.authHeroTitle' | t }}
      </h1>
      <p class="hero-description mt-5 max-w-lg text-base leading-7 text-cyan-50/80">
        {{ 'app.authHeroDescription' | t }}
      </p>
    </div>
