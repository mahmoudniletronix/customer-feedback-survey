<main class="auth-page grid min-h-screen bg-[var(--color-background)] lg:grid-cols-[1.05fr_0.95fr]">
  <section
    class="auth-hero hidden overflow-hidden bg-[var(--theme-color-primary)] p-8 text-white lg:flex lg:flex-col lg:justify-start"
  >
    <div class="auth-hero-content">
      <div
        class="hero-logo mb-8 inline-flex rounded-lg border border-white/80 bg-white/95 px-4 py-3 shadow-lg shadow-slate-950/15"
      >
        <img
          class="h-14 w-auto"
          [src]="brandAssets.authLogo"
          [attr.alt]="'common.niletronixLogoAlt' | t"
        />
      </div>
      <h1 class="hero-title max-w-xl text-3xl font-bold leading-tight">
        {{ 'app.authHeroTitle' | t }}
      </h1>
      <p class="hero-description mt-4 max-w-lg text-sm leading-6 text-white/90">
        {{ 'app.authHeroDescription' | t }}
      </p>
    </div>
    <div class="hero-animation-panel">
      <img
        class="hero-animation-image"
        [src]="brandAssets.authHeroAnimation"
        alt=""
        aria-hidden="true"
      />
    </div>
    <!-- <div class="hero-stats grid grid-cols-3">
      <div class="stat-card bg-white/10">
        <span class="block font-bold">18</span>
        {{ 'common.branches' | t }}
      </div>
      <div class="stat-card bg-white/10">
        <span class="block font-bold">64</span>
        {{ 'common.departments' | t }}
      </div>
      <div class="stat-card bg-white/10">
        <span class="block font-bold">92%</span>
        {{ 'common.sla' | t }}
      </div>
    </div> -->
  </section>
  <section class="login-stage flex items-center justify-center p-3 sm:p-4">
    <router-outlet />
  </section>
</main>
