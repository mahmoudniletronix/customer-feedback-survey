<label class="block">
  <span [class]="labelClasses()">{{ label() }}</span>
  <div class="relative">
    <input
      [class]="inputClasses()"
      [class.border-[#D94B5A]]="invalid()"
      [class.border-slate-200]="!invalid()"
      [type]="inputType()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    @if (canTogglePassword()) {
      <button
        class="password-toggle absolute inset-y-1 end-1 inline-flex w-9 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-[#11A7C9] focus:outline-none focus:ring-4 focus:ring-[#11A7C9]/10 disabled:pointer-events-none disabled:opacity-50"
        type="button"
        [disabled]="disabled()"
        [attr.aria-label]="passwordToggleLabel()"
        [attr.title]="passwordToggleLabel()"
        (click)="togglePasswordVisibility()"
      >
        <app-icon [icon]="passwordToggleIcon()" [size]="18" />
      </button>
    }
  </div>
  @if (hint()) {
    <span [class]="feedbackClasses() + ' text-slate-500'">{{ hint() }}</span>
  }
  @if (error()) {
    <span [class]="feedbackClasses() + ' font-medium text-[#D94B5A]'">{{ error() }}</span>
  }
</label>
