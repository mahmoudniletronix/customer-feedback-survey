<app-modal
  [title]="'users.resetPassword' | t"
  [open]="open()"
  (closed)="close()"
>
  <form class="space-y-3" [formGroup]="form" (ngSubmit)="submit()">
    @if (selectedUserLabel()) {
      <div class="border border-cyan-100 bg-cyan-50 p-3 text-xs font-semibold text-slate-700">
        {{ 'users.selectedUser' | t }}:
        <span class="text-[var(--theme-color-secondary)]">{{ selectedUserLabel() }}</span>
      </div>
    }

    <div class="grid gap-3 md:grid-cols-2">
      <app-input
        [label]="'auth.newPassword' | t"
        type="password"
        [placeholder]="'departmentAdmins.passwordPlaceholder' | t"
        formControlName="newPassword"
        [error]="newPasswordErrorKey() | t"
      />
      <app-input
        [label]="'auth.confirmNewPassword' | t"
        type="password"
        [placeholder]="'auth.confirmNewPasswordPlaceholder' | t"
        formControlName="confirmNewPassword"
        [error]="confirmNewPasswordErrorKey() | t"
      />
    </div>

    <p class="text-xs font-semibold text-slate-500">
      {{ 'users.resetPasswordNextLoginNote' | t }}
    </p>

    <div class="flex flex-wrap justify-end gap-2">
      <app-button type="button" variant="secondary" (pressed)="close()">
        {{ 'common.cancel' | t }}
      </app-button>
      <app-button type="submit" [loading]="loading()">
        <app-icon [icon]="resetPasswordIcon" [size]="17" />
        {{ 'users.resetPassword' | t }}
      </app-button>
    </div>
  </form>
</app-modal>
