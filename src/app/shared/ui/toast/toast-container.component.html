<div
  class="pointer-events-none fixed inset-x-3 top-3 z-[1000] flex max-h-[calc(100dvh-1.5rem)] flex-col gap-2 overflow-y-auto pe-1 sm:inset-x-auto sm:end-4 sm:top-4 sm:w-[22rem]"
  aria-live="polite"
  aria-atomic="true"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <article
      [class]="'pointer-events-auto relative overflow-hidden rounded-xl border px-3.5 py-3 pe-10 shadow-xl backdrop-blur-xl transition ' + shellClass(toast)"
      role="status"
    >
      <span [class]="'absolute inset-y-0 start-0 w-1 ' + accentClass(toast)"></span>

      <div class="flex min-w-0 gap-2.5">
        <span
          [class]="'mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg ring-1 ' + iconClass(toast)"
        >
          <app-icon [icon]="iconFor(toast)" [size]="16" />
        </span>
        <div class="min-w-0 flex-1">
          <p class="break-words text-sm font-extrabold leading-5 text-slate-950 [overflow-wrap:anywhere]">
            {{ toast.title }}
          </p>
          @if (toast.description) {
            <p class="mt-1 max-h-14 overflow-hidden break-words text-[11px] font-semibold leading-5 text-slate-600 [overflow-wrap:anywhere]">
              {{ toast.description }}
            </p>
          }
        </div>
      </div>

      <button
        type="button"
        class="absolute end-2 top-2 flex h-7 w-7 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
        [attr.aria-label]="'Dismiss notification'"
        (click)="toastService.dismiss(toast.id)"
      >
        <app-icon [icon]="closeIcon" [size]="15" />
      </button>
    </article>
  }
</div>
